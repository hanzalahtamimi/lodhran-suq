<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lodhran Suq - لودھراں سوک</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; text-align: right; direction: rtl; color: #333; }
        header { background-color: #1b4d3e; color: white; padding: 20px; text-align: center; }
        .status-badge { font-size: 20px; font-weight: bold; padding: 10px; margin-top: 10px; border-radius: 8px; display: inline-block; }
        .open { background-color: #27ae60; color: white; }
        .closed { background-color: #c0392b; color: white; }
        .container { max-width: 1000px; margin: 25px auto; padding: 0 15px; }
        .btn { display: block; text-align: center; background-color: #25d366; color: white; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 15px; border: none; cursor: pointer; width: 100%; font-size: 16px; }
        .admin-box { text-align: center; padding: 20px; margin-top: 40px; border-top: 2px solid #ccc; }
    </style>
    <script>
        function getStatus() { return localStorage.getItem("shop_status") !== "closed"; }
        
        window.onload = function() {
            var statusDiv = document.getElementById("statusBanner");
            if (getStatus()) {
                statusDiv.innerHTML = "✅ دکان کھلی ہے (Open) | ابھی آرڈر کریں";
                statusDiv.className = "status-badge open";
            } else {
                statusDiv.innerHTML = "❌ دکان بند ہے (Closed) | آرڈر نہیں لے سکتے";
                statusDiv.className = "status-badge closed";
            }
        };

        function toggleShop() {
            if (getStatus()) { localStorage.setItem("shop_status", "closed"); } 
            else { localStorage.setItem("shop_status", "open"); }
            location.reload();
        }

        function processOrder(shopName) {
            if (!getStatus()) { alert("معذرت! دکان اس وقت بند ہے۔"); return; }
            alert("آرڈر واٹس ایپ پر بھیجا جا رہا ہے...");
            // یہاں اپنا پرانا آرڈر والا لنک کوڈ لگا سکتے ہیں
        }
    </script>
</head>
<body>
    <header>
        <h1>لودھراں سوک (Lodhran Suq)</h1>
        <div id="statusBanner"></div>
    </header>

    <div class="container">
        <!-- یہاں اپنے پرانے کارڈز وغیرہ لگا دیں -->
        <button onclick="processOrder('جنرل سٹور')" class="btn">جنرل سٹور سے آرڈر کریں</button>
        
        <div class="admin-box">
            <p>ایڈمن کنٹرول (صرف آپ کے لیے):</p>
            <button onclick="toggleShop()" style="padding: 10px 20px; background: #34495e; color: white; border: none; border-radius: 5px;">آن لائن / آف لائن سوئچ کریں</button>
        </div>
    </div>
</body>
</html>
