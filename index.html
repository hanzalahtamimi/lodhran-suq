<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lodhran Suq - لودھراں سوک</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; text-align: right; direction: rtl; unicode-bidi: embed; color: #333; }
        header { background-color: #1b4d3e; color: white; padding: 30px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 32px; }
        header p { margin: 8px 0 0; font-size: 15px; color: #a3e4d7; }
        
        /* سٹیٹس بینر کی سٹائلنگ */
        .status-badge { font-size: 18px; font-weight: bold; padding: 15px; margin: 15px auto; border-radius: 8px; display: inline-block; width: 100%; max-width: 500px; }
        .open { background-color: #27ae60; color: white; border: 2px solid #fff; }
        .closed { background-color: #c0392b; color: white; border: 2px solid #fff; }

        .city-badge { background-color: #e67e22; color: white; display: inline-block; padding: 6px 18px; border-radius: 20px; font-size: 14px; margin-top: 12px; font-weight: bold; }
        .container { max-width: 1000px; margin: 25px auto; padding: 0 15px; }
        .customer-box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; border-right: 5px solid #27ae60; }
        .customer-box h3 { margin-top: 0; color: #1b4d3e; }
        .form-group { margin-bottom: 12px; text-align: right; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; font-size: 14px; text-align: right; direction: rtl; }
        .reward-banner { background: #e8f8f5; border: 1px dashed #27ae60; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; color: #0e6251; font-weight: bold; text-align: center; line-height: 1.6; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .shop-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-top: 5px solid #27ae60; display: flex; flex-direction: column; justify-content: space-between; }
        .shop-card h3 { margin-top: 0; color: #1b4d3e; font-size: 20px; }
        .shop-card p { color: #666; font-size: 14px; line-height: 1.6; }
        .pharmacy-card { border-top-color: #e74c3c; }
        .pharmacy-note { font-size: 12px; color: #c0392b; background: #fadbd8; padding: 8px; border-radius: 5px; margin: 10px 0; font-weight: bold; }
        .full-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-top: 5px solid #3498db; margin-top: 20px; }
        .full-card h3 { margin-top: 0; color: #2980b9; font-size: 20px; }
        .about-section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-top: 35px; border-top: 5px solid #1b4d3e; }
        .about-section h3 { margin-top: 0; color: #1b4d3e; }
        .about-section p { font-size: 14px; color: #555; line-height: 1.8; }
        .contact-info { background: #fdfefe; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-top: 15px; font-size: 14px; }
        .btn { display: block; text-align: center; background-color: #25d366; color: white; padding: 12px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 15px; border: none; cursor: pointer; width: 100%; font-size: 16px; font-family: inherit; }
        .btn-blue { background-color: #3498db; }
        .admin-box { text-align: center; padding: 20px; margin-top: 40px; background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 5px solid #e67e22; }
        footer { background-color: #2c3e50; color: white; text-align: center; padding: 20px; margin-top: 40px; font-size: 14px; }
    </style>
    
    <script>
        function isShopOpen() { return localStorage.getItem("shop_status") !== "closed"; }
        window.onload = function() {
            var statusDiv = document.getElementById("statusBanner");
            if (isShopOpen()) {
                statusDiv.innerHTML = "✅ دکان کھلی ہے | Shop is Open";
                statusDiv.className = "status-badge open";
            } else {
                statusDiv.innerHTML = "❌ دکان بند ہے | Shop is Closed";
                statusDiv.className = "status-badge closed";
            }
        };

        function toggleShop() {
            if (isShopOpen()) { localStorage.setItem("shop_status", "closed"); }
            else { localStorage.setItem("shop_status", "open"); }
            location.reload();
        }

        function processOrder(shopName) {
            if (!isShopOpen()) { alert("معذرت! اس وقت دکان بند ہے۔"); return; }
            var name = document.getElementById("custName").value.trim();
            var phone = document.getElementById("custPhone").value.trim();
            var loc = document.getElementById("lodhranArea").value;
            if (!name || !phone) { alert("نام اور نمبر درج کریں!"); return; }
            var text = "آرڈر: " + shopName + "\nنام: " + name + "\nفون: " + phone + "\nعلاقہ: " + loc;
            window.open("https://wa.me/923027442309?text=" + encodeURIComponent(text), '_blank');
        }
    </script>
</head>
<body>
    <header>
        <h1>لودھراں سوک (Lodhran Suq)</h1>
        <div id="statusBanner"></div>
        <p>آپ کی اپنی ڈیجیٹل لوکل مارکیٹ</p>
        <div class="city-badge">📍 لودھراں شہر اور گردونواح</div>
    </header>

    <div class="container">
        <div class="customer-box">
            <h3>👤 کسٹمر کی معلومات</h3>
            <div class="form-group">
                <input type="text" id="custName" placeholder="آپ کا نام">
                <input type="text" id="custPhone" placeholder="موبائل نمبر">
                <select id="lodhranArea">
                    <option value="Main City">مین سٹی لودھراں</option>
                    <option value="Other">دیگر</option>
                </select>
            </div>
        </div>

        <div class="grid">
            <div class="shop-card"><h3>🛒 جنرل سٹور</h3><button onclick="processOrder('جنرل سٹور')" class="btn">آرڈر کریں</button></div>
            <div class="shop-card"><h3>🍎 تازہ پھل</h3><button onclick="processOrder('تازہ پھل')" class="btn">آرڈر کریں</button></div>
            <div class="shop-card"><h3>🥦 تازہ سبزیاں</h3><button onclick="processOrder('تازہ سبزیاں')" class="btn">آرڈر کریں</button></div>
            <div class="shop-card"><h3>🍲 تازہ کھانا</h3><button onclick="processOrder('تازہ کھانا')" class="btn">آرڈر کریں</button></div>
        </div>

        <div class="shop-card pharmacy-card" style="margin-top:20px;"><h3>💊 فارمیسی</h3><button onclick="processOrder('فارمیسی')" class="btn" style="background-color: #e74c3c;">پرچی کے ساتھ آرڈر کریں</button></div>
        <div class="full-card"><h3>📦 پک اینڈ ڈراپ</h3><button onclick="processOrder('پک اینڈ ڈراپ')" class="btn btn-blue">آرڈر کریں</button></div>

        <div class="admin-box">
            <h3>⚙️ ایڈمن کنٹرول</h3>
            <button onclick="toggleShop()" class="btn" style="background-color: #e67e22; max-width: 300px; margin: 0 auto;">آن لائن / آف لائن سوئچ کریں</button>
        </div>
    </div>
    <footer><p>&copy; 2026 Lodhran Suq.</p></footer>
</body>
</html>
